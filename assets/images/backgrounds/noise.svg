<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbluence" baseFrequency="2.0" numOctaves="3" seed="0" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend mode="screen" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="transparent" filter="url(#noise)">
    <animate attributeName="filter-offset" from="0 0" to="10 10" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>